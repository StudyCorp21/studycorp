<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proposer une annonce — StudyCorp</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><a class="brand" href="index.html"><span>Study</span>Corp</a><nav><a href="index.html#opportunites">Opportunités</a><a href="index.html#apropos">À propos</a></nav></header><main class="form-page section"><p class="eyebrow">Contribuer à StudyCorp</p><h1>Proposer une annonce</h1><p class="lead compact">Partagez une information académique utile. Cette version prépare un message que vous pourrez transmettre à l’équipe StudyCorp.</p><form id="proposal" class="form"><label>Établissement<input required name="school" placeholder="Ex. Université de Picardie Jules Verne"></label><label>Formation / opportunité<input required name="program" placeholder="Nom de la formation"></label><div class="form-row"><label>Pays<input required name="country" placeholder="France"></label><label>Niveau<select name="level"><option>Licence</option><option>Master</option><option>Doctorat</option><option>Autre</option></select></label></div><label>Information à partager<textarea required name="info" rows="6" placeholder="Que savez-vous de cette opportunité ?"></textarea></label><label>Bourse / projet associé (facultatif)<textarea name="funding" rows="3"></textarea></label><label>Source ou lien officiel (facultatif)<input name="source" type="url" placeholder="https://…"></label><label>Votre contact (facultatif)<input name="contact" placeholder="E-mail ou autre moyen de contact"></label><button class="button" type="submit">Préparer l’annonce</button></form><div id="result" class="result" hidden></div></main><script src="js/proposer.js"></script></body></html>
